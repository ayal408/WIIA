name: Build Wii homebrew games

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    strategy:
      matrix:
        include:
          - game: games/01-pointer-shooter
            slug: 01-pointer-shooter
          - game: games/02-balance-quest
            slug: 02-balance-quest
          - game: games/03-swing-slash
            slug: 03-swing-slash
          - game: games/04-hop-run
            slug: 04-hop-run
          - game: games/05-quiz-buzzer
            slug: 05-quiz-buzzer
          - game: games/06-duck-hunt
            slug: 06-duck-hunt
          - game: games/07-rhythm-tap
            slug: 07-rhythm-tap
          - game: games/08-simon-says
            slug: 08-simon-says
          - game: games/09-island-adventure
            slug: 09-island-adventure
          - game: games/10-connect-four
            slug: 10-connect-four
          - game: games/11-whack-a-mole
            slug: 11-whack-a-mole
          - game: games/12-ski-slalom
            slug: 12-ski-slalom
          - game: games/13-usb-keyboard
            slug: 13-usb-keyboard
          - game: games/14-no-sensor-cursor
            slug: 14-no-sensor-cursor
          - game: games/template
            slug: template
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.game }}
        working-directory: ${{ matrix.game }}
        run: make -j$(nproc)

      - name: Upload .dol artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-dol
          path: ${{ matrix.game }}/*.dol

  package-usb:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built .dol files
        uses: actions/download-artifact@v4
        with:
          path: built

      - name: Assemble SD/USB apps folder (boot.dol + meta.xml per game)
        run: |
          set -e
          for dir in built/*-dol; do
            game_slug=$(basename "$dir" | sed 's/games-//; s/-dol$//')
            dest="usb-sdcard/apps/$game_slug"
            if [ -d "$dest" ]; then
              dol_file=$(find "$dir" -name '*.dol' | head -n1)
              if [ -n "$dol_file" ]; then
                cp "$dol_file" "$dest/boot.dol"
              fi
            fi
          done

      - name: Upload ready-to-copy USB/SD apps folder
        uses: actions/upload-artifact@v4
        with:
          name: wii-usb-apps
          path: usb-sdcard/apps
